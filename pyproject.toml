# Workspace root — not itself a published package. Members live in
# packages/* (doctor, history, search, graph, pm).

[project]
name = "devin-explore"
version = "0.0.0"
description = "Monorepo workspace for the devin-explore product: doctor, history, search, graph, pm."
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
extend-exclude = ["packages/history/legacy"]

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
