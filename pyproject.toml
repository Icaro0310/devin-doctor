[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-graph"
version = "0.1.0"
description = "Knowledge graph over Devin sessions — projects, files, tools and decisions as queryable nodes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Icaro0310" }]
dependencies = [
  "devin-internals-spec @ git+https://github.com/Icaro0310/devin-internals-spec.git@v0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devin-graph = "devin_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
